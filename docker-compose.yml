
services:
  # Base de datos MySQL
  db:
    image: mysql:8.0
    container_name: wp_mysql
    volumes:
      - ./db_data:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    ports:
      - "3306:3306"
    networks:
      - wp_network

  # WordPress con WooCommerce
  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    container_name: wp_site
    volumes:
      - ./wordpress:/var/www/html
      - ./plugins:/var/www/html/wp-content/plugins
      - ./themes:/var/www/html/wp-content/themes
    ports:
      - "8000:80"
    restart: always
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
    networks:
      - wp_network

  # Aplicación Django con venv
  django_app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: wp_django_backend
    volumes:
      - .:/app
      - ./venv:/opt/venv
    ports:
      - "8001:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=mysql://wordpress:wordpress@db:3306/wordpress
      - DJANGO_SETTINGS_MODULE=django_app.settings
      - PATH=/opt/venv/bin:$PATH
    depends_on:
      - db
      - redis
    networks:
      - wp_network

  # Redis para Celery
  redis:
    image: redis:7-alpine
    container_name: wp_redis
    ports:
      - "6379:6379"
    networks:
      - wp_network

  # Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wp_celery_worker
    volumes:
      - .:/app
      - ./venv:/opt/venv
    environment:
      - PATH=/opt/venv/bin:$PATH
      - DATABASE_URL=mysql://wordpress:wordpress@db:3306/wordpress
      - DJANGO_SETTINGS_MODULE=django_app.settings
    command: celery -A django_app worker -l info
    depends_on:
      - db
      - redis
    networks:
      - wp_network

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: wp_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - db
    networks:
      - wp_network

volumes:
  db_data:

networks:
  wp_network:
    driver: bridge
